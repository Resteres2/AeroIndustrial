

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'CreateMod'; url = 'https://maven.createmod.net' }
    maven { name = 'IThundxr'; url = 'https://maven.ithundxr.dev/snapshots' }
    maven { name = 'RyanHCode'; url = 'https://maven.ryanhcode.dev/releases' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"

    // Compile-time integration only. These jars are never bundled into AeroIndustrial.
    compileOnly modrinth_sable
    compileOnly modrinth_aeronautics
    compileOnly modrinth_gtceu

    // Development runtime: the released mod remains soft-compatible, but runClient/runServer
    // can exercise the real integration stack when Gradle resolves these artifacts.
    runtimeOnly modrinth_sable
    runtimeOnly modrinth_gtceu
    runtimeOnly "curse.maven:create-aeronautics-676721:8763471"
}

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    def props = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: 'A new industrial-air engineering layer connecting electrical processing, rotational mechanics and physics aircraft through AeroFlux.'
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
